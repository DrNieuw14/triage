name: Build macOS App

# Builds a real, native TriageApp.app on a GitHub macOS runner — this is
# genuine Mac hardware, not a cross-compile from Windows/Linux (PyInstaller
# and the static PHP builder both need to run on the OS they're targeting).
#
# Apple Silicon (arm64) only — covers any Mac sold since late 2020. Intel
# (x86_64) macOS runners were tried and dropped: GitHub only offers Intel
# Mac hardware through its paid "larger runners" tier now (even for public
# repos), and that job failed outright with "recent account payments have
# failed or your spending limit needs to be increased" rather than a build
# error. Revisit only if Intel support becomes a real requirement and
# someone's opted into that billing deliberately.
#
# NOTE: macos-13 was silently removed from GitHub's runner pool at one
# point during this workflow's life, which didn't surface as an error —
# the job just sat queued forever with zero steps ever starting, since
# nothing matched that label anymore. macos-15 is current as of writing,
# but GitHub retires old macOS images on this same rolling basis — if the
# job goes queued indefinitely again, that's the tell (not a build
# failure), and https://github.com/actions/runner-images has the current
# label list.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'ml/**'
      - 'laravel-app/**'
      - '.github/workflows/build-macos.yml'

jobs:
  build:
    runs-on: macos-15

    # MACOSX_DEPLOYMENT_TARGET: the runner builds on macOS 15, but the app
    # needs to also launch on older Macs (as old as Monterey, 12.0). This
    # tells every compiler invoked in this job (spc's clang build of static
    # PHP, any pip package that needs to compile a C extension) to target
    # that floor instead of defaulting to the runner's own OS version. It
    # does NOT retroactively fix a binary that's already prebuilt for a
    # newer minimum (e.g. the Python interpreter actions/setup-python
    # installs) — that's what the "Verify bundled binaries" step checks for.
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
      SPC_URL: https://github.com/crazywhalecc/static-php-cli/releases/download/2.8.5/spc-macos-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v4

      # Build-time PHP (for composer install / artisan) — separate from the
      # static PHP binary we bundle for the shipped app's own runtime.
      - name: Set up build-time PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install PHP dependencies
        working-directory: laravel-app
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # laravel-app/.env is gitignored (never pushed) and .env.example is
      # the generic Laravel default — missing this app's own TRIAGE_API_URL
      # / TRAIN_SHARED_SECRET / TRAIN_PAGE_PASSWORD keys entirely, and
      # SESSION_DRIVER=database instead of the `file` driver this packaged,
      # DB-less build needs. Writing the real values directly here instead
      # of patching .env.example, since .env.example is meant to stay the
      # generic "here's what a dev sets up locally" template.
      #
      # TRAIN_SHARED_SECRET's value must byte-for-byte match ml/api.py's
      # hardcoded fallback default — the two processes don't share env
      # loading, so this is intentionally duplicated, not a typo. This has
      # to run *before* the frontend build below — Laravel's Vite plugin
      # reads .env (any VITE_*-prefixed keys) at build time via loadEnv,
      # not just at request time.
      - name: Configure .env for the packaged app
        working-directory: laravel-app
        run: |
          cp .env.example .env
          php artisan key:generate --force

          {
            echo "APP_NAME=\"Triage Decision Support\""
            echo "APP_URL=http://127.0.0.1:8020"
            echo "SESSION_DRIVER=file"
            echo "TRIAGE_API_URL=http://127.0.0.1:5055"
            echo "TRAIN_SHARED_SECRET=03fba325c50981107f840218ba31c8a45582db301a93dad1"
            echo "TRAIN_PAGE_PASSWORD=triage2026"
          } >> .env

          touch database/database.sqlite
          php artisan migrate --force

      - name: Build frontend assets
        working-directory: laravel-app
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python build dependencies
        run: |
          pip install -r ml/requirements.txt
          pip install -r launcher/requirements.txt

      - name: Build TriageAPI (Flask ML API)
        working-directory: ml
        run: pyinstaller TriageAPI.mac.spec

      - name: Build TriageApp.app (launcher)
        working-directory: launcher
        run: pyinstaller TriageApp.mac.spec

      # Pinned to a tagged static-php-cli release (not the "nightly" channel,
      # which is a continuously-rebuilt bleeding-edge binary that broke
      # craft.yml parsing and then its own downloader in back-to-back runs
      # of this workflow) — a release asset is a .tar.gz, not a raw binary.
      - name: Download static PHP builder (spc)
        run: |
          curl -fsSL -o spc.tar.gz "$SPC_URL"
          tar -xzf spc.tar.gz
          if [ ! -f ./spc ]; then
            echo "spc not found at top level after extraction, searching archive contents..."
            find . -maxdepth 2 -type f -name spc
            SPC_BIN="$(find . -maxdepth 2 -type f -name spc | head -n1)"
            if [ -z "$SPC_BIN" ]; then
              echo "::error::Could not locate the spc binary inside the downloaded release archive."
              exit 1
            fi
            cp "$SPC_BIN" ./spc
          fi
          chmod +x ./spc
          ./spc --version

      # spc craft resolves each extension's source (php-src, openssl, the
      # `watcher` lib, etc.) via unauthenticated calls to api.github.com,
      # which GitHub rate-limits hard (60 requests/hour per IP) — runner
      # IPs are heavily shared, so this gets hit often and spc's own
      # fallback path crashes on the resulting 403 instead of failing
      # gracefully. Authenticating with GITHUB_TOKEN (provided free by
      # Actions for every run, no secret to configure) raises that to
      # 5,000/hour and is the fix static-php-cli's own docs recommend
      # for CI use.
      - name: Build a static, self-contained PHP CLI binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > craft.yml <<'EOF'
          php-version: "8.3"
          # mbregex (needs the onig lib) is a separate extension from plain
          # mbstring in spc's catalog — without it, mb_split()/mb_ereg*()
          # are undefined, and Laravel's Str::studly() (called constantly
          # during routing/class resolution) calls mb_split() directly, so
          # every request 500'd until this was added.
          extensions: "pdo_sqlite,sqlite3,curl,openssl,mbstring,mbregex,tokenizer,dom,fileinfo,filter,ctype,session,xml,bcmath"
          sapi:
            - cli
          EOF
          ./spc craft

          echo "Searching for the built php binary..."
          STATIC_PHP="$(find . -type f -name php -perm +111 -path '*buildroot*' | head -n1)"
          if [ -z "$STATIC_PHP" ]; then
            echo "::error::Could not find the static php binary spc built. Listing likely directories for debugging:"
            find . -maxdepth 3 -iname '*buildroot*' -o -iname '*php-sapi*'
            exit 1
          fi
          echo "Found static php at: $STATIC_PHP"
          "$STATIC_PHP" --version
          echo "STATIC_PHP_PATH=$STATIC_PHP" >> "$GITHUB_ENV"

      # Everything the app needs lives inside the .app bundle's
      # Contents/Resources/ — see launcher.py's base_dir() for why.
      - name: Assemble TriageApp.app
        run: |
          set -euo pipefail
          APP="launcher/dist/TriageApp.app"
          RESOURCES="$APP/Contents/Resources"

          mkdir -p "$RESOURCES/runtime/php"
          cp "$STATIC_PHP_PATH" "$RESOURCES/runtime/php/php"
          chmod +x "$RESOURCES/runtime/php/php"
          # GitHub's macOS runners run background AV/EDR scanning that has
          # been observed to quarantine or silently remove freshly-built,
          # unsigned executables moments after they're written — a prior
          # run of this workflow saw the php binary run fine immediately
          # after `spc craft` built it, then vanish ("No such file or
          # directory") by the very next step after being copied here,
          # with nothing in this workflow touching it in between. An
          # ad-hoc signature (no paid Developer account needed — `-s -`
          # just marks it as signed, not by anyone in particular) is the
          # standard mitigation, and is required outright to execute at
          # all on Apple Silicon regardless of the AV question.
          xattr -cr "$RESOURCES/runtime/php/php" || true
          codesign --force -s - "$RESOURCES/runtime/php/php"
          echo "Verifying the bundled php binary runs immediately after signing:"
          "$RESOURCES/runtime/php/php" --version
          # Minimal — the static binary has every extension compiled in
          # (no extension_dir / .so loading needed), so this just sets a
          # couple of sane defaults rather than fixing broken paths like
          # the Windows build's php.ini needed to.
          printf 'date.timezone = UTC\nshort_open_tag = Off\n' > "$RESOURCES/runtime/php/php.ini"

          mkdir -p "$RESOURCES/api"
          cp -R ml/dist/TriageAPI "$RESOURCES/api/TriageAPI"
          xattr -cr "$RESOURCES/api/TriageAPI" || true
          find "$RESOURCES/api/TriageAPI" -type f \( -perm -u+x -o -name '*.dylib' -o -name '*.so' \) -print0 \
            | xargs -0 -I{} codesign --force -s - "{}"
          # api.py resolves MODEL_PATH relative to sys.executable's own
          # directory when frozen (so a /train retrain persists across
          # runs instead of writing into a temp extraction dir) — it is
          # NOT bundled via PyInstaller's `datas`, so it has to be copied
          # here by hand, right next to the actual TriageAPI binary.
          cp ml/triage_model.pkl "$RESOURCES/api/TriageAPI/triage_model.pkl"

          cp -R laravel-app "$RESOURCES/laravel-app"
          rm -rf "$RESOURCES/laravel-app/tests" "$RESOURCES/laravel-app/.git"

          # Ad-hoc sign the whole bundle last, on top of the individual
          # binaries already signed above — this covers TriageApp's own
          # launcher executable and its embedded Python.framework, which
          # PyInstaller produced but never signed either.
          xattr -cr "$APP" || true
          codesign --force --deep -s - "$APP"

      # Nothing above guarantees the interpreter/binaries actions/setup-python
      # and pip installed were themselves built for macOS 12 — only that
      # anything WE compile in this job (spc's static PHP) targets it. This
      # reads each bundled Mach-O's embedded minimum-OS load command
      # (LC_BUILD_VERSION / the older LC_VERSION_MIN_MACOSX) via `otool -l`
      # and fails the job if anything requires newer than 12.0, so a build
      # that can't actually launch on Monterey never reaches the artifacts
      # list looking like a working one.
      - name: Verify bundled binaries can launch on macOS 12 (Monterey)
        run: |
          set -uo pipefail
          TARGET_MAJOR=12
          TARGET_MINOR=0
          FAILED=0

          check_minos() {
            local bin="$1"
            [ -f "$bin" ] || return 0
            local ver
            ver="$(otool -l "$bin" 2>/dev/null | awk '
              /LC_VERSION_MIN_MACOSX/ { getline; getline; print $2; exit }
              /LC_BUILD_VERSION/ { getline; getline; print $2; exit }
            ')"
            if [ -z "$ver" ]; then
              echo "  (?) $bin -> no minimum-OS load command found (skipping)"
              return 0
            fi
            local vmajor="${ver%%.*}"
            local rest="${ver#*.}"
            local vminor="${rest%%.*}"
            echo "  $bin -> requires macOS $ver"
            if [ "$vmajor" -gt "$TARGET_MAJOR" ] || { [ "$vmajor" -eq "$TARGET_MAJOR" ] && [ "$vminor" -gt "$TARGET_MINOR" ]; }; then
              echo "::error::$bin requires macOS $ver or later — it will refuse to launch on Monterey (12.0)."
              FAILED=1
            fi
          }

          echo "Checking the static PHP CLI binary..."
          check_minos "$STATIC_PHP_PATH"

          echo "Checking TriageAPI (Flask ML backend)..."
          check_minos "launcher/dist/TriageApp.app/Contents/Resources/api/TriageAPI/TriageAPI"

          echo "Checking TriageApp launcher..."
          check_minos "launcher/dist/TriageApp.app/Contents/MacOS/TriageApp"

          echo "Checking the bundled Python runtime..."
          while IFS= read -r -d '' f; do
            check_minos "$f"
          done < <(find "launcher/dist/TriageApp.app" -type f \( -name "Python" -o -name "*.dylib" -o -iname "python3.*" \) -print0)

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::One or more bundled binaries were built for a newer macOS than Monterey (12.0). This zip would not launch on the target machine — see MACOS_BUILD.md."
            exit 1
          fi
          echo "All checked binaries are compatible with macOS 12.0 (Monterey) or later."

      - name: Smoke-test the assembled app on real macOS
        run: |
          set -euo pipefail
          # Must be absolute: the subshell below `cd`s into laravel-app
          # before referencing $APP again, and a relative path silently
          # resolves against that new directory instead of this one —
          # this was the actual cause of every prior "No such file or
          # directory" failure here, not the binaries themselves.
          APP="$(pwd)/launcher/dist/TriageApp.app/Contents/Resources"

          echo "Sanity-checking both binaries are still present and runnable right before use:"
          ls -la "$APP/runtime/php/php" "$APP/api/TriageAPI/TriageAPI"
          "$APP/runtime/php/php" --version

          "$APP/api/TriageAPI/TriageAPI" &
          API_PID=$!

          (
            cd "$APP/laravel-app"
            "$APP/runtime/php/php" -c "$APP/runtime/php/php.ini" -S 127.0.0.1:8020 -t public &
            echo $! > /tmp/php_pid
          )
          PHP_PID="$(cat /tmp/php_pid)"

          cleanup() { kill "$API_PID" "$PHP_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          echo "Waiting for the ML API health check..."
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5055/health; then break; fi
            [ "$i" -eq 30 ] && { echo "::error::TriageAPI never came up"; exit 1; }
            sleep 1
          done
          echo

          echo "Waiting for the Laravel form..."
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8020/triage; then break; fi
            [ "$i" -eq 30 ] && { echo "::error::Laravel server never came up"; exit 1; }
            sleep 1
          done
          echo "Laravel form responded OK."

          echo "Sanity-checking a real /predict call through the ML API directly..."
          curl -fsS -X POST http://127.0.0.1:5055/predict \
            -H "Content-Type: application/json" \
            -d '{"age":45,"sbp":120,"dbp":80,"hr":90,"rr":18,"temp":37.0,"pain_score":5}'
          echo
          echo "Smoke test passed: both backends started, responded, and produced a real prediction on macOS (arm64)."

      - name: Zip the app for download
        run: |
          cd launcher/dist
          ditto -c -k --sequesterRsrc --keepParent TriageApp.app "TriageApp-macos-arm64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: TriageApp-macos-arm64
          path: launcher/dist/TriageApp-macos-arm64.zip
          retention-days: 30
